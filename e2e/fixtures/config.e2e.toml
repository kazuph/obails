[vault]
  path = "e2e/fixtures/test-vault"
  delete_mode = "vault_trash"

[attachment]
  location = "vault_root"
  folder = ""

[recovery]
  snapshot_interval_minutes = 5
  retention_days = 7

[daily_notes]
  folder = "dailynotes"
  format = "2006-01-02"
  template = "daily_note"

[timeline]
  section = "## Memos"
  time_format = "15:04"

[templates]
  folder = "templates"

[editor]
  font_size = 14
  font_family = "SF Mono"
  line_numbers = true
  word_wrap = true

[ui]
  theme = "github-light"
  sidebar_width = 398
  [ui.file_explorer]
    auto_reveal = true
    sort_field = "name"
    sort_direction = "ascending"
