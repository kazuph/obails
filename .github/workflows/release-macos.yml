name: Release macOS

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-macos
  cancel-in-progress: false

jobs:
  plan:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      publish: ${{ steps.version.outputs.publish }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - name: Check whether this version is already published
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="v$(node -p "require('./package.json').version")"
          gh api --paginate "repos/$GITHUB_REPOSITORY/releases" --jq '.[].tag_name' > "$RUNNER_TEMP/released-tags"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          if grep -Fxq "$tag" "$RUNNER_TEMP/released-tags"; then
            echo 'publish=false' >> "$GITHUB_OUTPUT"
          else
            echo 'publish=true' >> "$GITHUB_OUTPUT"
          fi
  release:
    needs: plan
    if: needs.plan.outputs.publish == 'true'
    runs-on: macos-26
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: pnpm/action-setup@v4
        with:
          version: '10.18.3'
      - name: Validate release version and architecture
        env:
          RELEASE_TAG: ${{ needs.plan.outputs.tag }}
        run: |
          test "$(uname -m)" = arm64
          test "$RELEASE_TAG" = "v$(node -p "require('./package.json').version")"
          test -z "$(git ls-remote origin "refs/tags/$RELEASE_TAG")"
      - name: Install locked dependencies and matching Wails CLI
        run: |
          pnpm install --frozen-lockfile
          pnpm --dir frontend install --frozen-lockfile
          go install "github.com/wailsapp/wails/v3/cmd/wails3@$(go list -m -f '{{.Version}}' github.com/wailsapp/wails/v3)"
      - name: Build a fresh production bundle
        run: |
          rm -rf frontend/dist
          pnpm --dir frontend run build
          wails3 task darwin:package
      - name: Test backend, CLI, frontend, and real browser
        env:
          PLAYWRIGHT_HTML_OPEN: never
        run: |
          go test ./... -v
          go test -tags cli ./cmd/cli/... -v
          pnpm --dir frontend test
          pnpm exec playwright test --retries=0
          pnpm exec playwright test --config playwright.real.config.ts --retries=0
      - name: Sign, notarize, staple, and validate
        env:
          OBAILS_SIGNING_CERTIFICATE_BASE64: ${{ secrets.OBAILS_SIGNING_CERTIFICATE_BASE64 }}
          OBAILS_SIGNING_CERTIFICATE_PASSWORD: ${{ secrets.OBAILS_SIGNING_CERTIFICATE_PASSWORD }}
          OBAILS_NOTARY_KEY_BASE64: ${{ secrets.OBAILS_NOTARY_KEY_BASE64 }}
          OBAILS_NOTARY_KEY_ID: ${{ secrets.OBAILS_NOTARY_KEY_ID }}
          OBAILS_NOTARY_ISSUER_ID: ${{ secrets.OBAILS_NOTARY_ISSUER_ID }}
        run: bash scripts/release-macos-ci.sh
      - name: Upload verified distribution
        uses: actions/upload-artifact@v4
        with:
          name: obails-notarized-macos-arm64
          path: |
            bin/obails-*-macos-arm64.zip
            bin/obails-*-macos-arm64.zip.sha256
          if-no-files-found: error
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.plan.outputs.tag }}
        run: gh release create "$RELEASE_TAG" bin/obails-*-macos-arm64.zip bin/obails-*-macos-arm64.zip.sha256 --target "$GITHUB_SHA" --generate-notes
