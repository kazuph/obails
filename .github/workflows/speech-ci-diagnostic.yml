name: Diagnose Apple Speech assets

on:
  pull_request:
    paths:
      - .github/workflows/speech-ci-diagnostic.yml

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Record asset reservation and installation state
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          source = Path('build/darwin/transcribe/main.swift').read_text()
          source = source.replace('try await AssetInventory.reserve(locale: locale)', r'''stderr("hardware available: \(SpeechTranscriber.isAvailable)")
              stderr("reserved before: \(await AssetInventory.reservedLocales)")
              let newlyReserved = try await AssetInventory.reserve(locale: locale)
              stderr("new reservation: \(newlyReserved)")
              stderr("reserved after: \(await AssetInventory.reservedLocales)")
              stderr("module status: \(await AssetInventory.status(forModules: [transcriber]))")''')
          source = source.replace('if let request = try await AssetInventory.assetInstallationRequest', 'stderr("requesting installation")\n        if let request = try await AssetInventory.assetInstallationRequest')
          source = source.replace('try await request.downloadAndInstall()', 'stderr("installation request created")\n            try await request.downloadAndInstall()')
          Path(os.environ['RUNNER_TEMP'], 'speech-diagnostic.swift').write_text(source)
          PY
          swiftc -O "$RUNNER_TEMP/speech-diagnostic.swift" -o "$RUNNER_TEMP/obails-transcribe"
          codesign -dvv "$RUNNER_TEMP/obails-transcribe" 2>&1
          say -v Kyoko -o "$RUNNER_TEMP/speech.aiff" 'これはテストです。音声認識の確認をしています。'
          "$RUNNER_TEMP/obails-transcribe" "$RUNNER_TEMP/speech.aiff" ja-JP
